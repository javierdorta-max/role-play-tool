<DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Roleplay Aquaservice 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0052cc;
      --primary-dark: #003d99;
      --primary-light: #e6f0ff;
      --accent: #00a8ff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --primary-light: #1e3a8a;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Public Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      max-width: 1280px;
      margin: 0 auto;
    }

    h1, h2, h3, .font-sora { font-family: 'Sora', sans-serif; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .logo {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 16px;
    }

    @media (min-width: 768px) {
      .sim-layout {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 16px;
        transition: all 0.3s ease;
      }
      .sim-layout.senior-mode {
        grid-template-columns: 1fr;
        max-width: 900px;
        margin: 0 auto;
      }
    }

    label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.9rem; }
    input, select, button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 1rem;
      background: var(--card-bg);
      color: var(--text);
    }

    button.btn-primary {
      background: var(--primary);
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover { background: var(--primary-dark); }

    .chat-box {
      height: 420px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--border);
    }
    .msg.user {
      align-self: flex-end;
      background: var(--primary);
      color: white;
    }

    .mic-controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }

    .mic-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .mic-btn.recording {
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .checklist-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .chk-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .chk-item.done { color: var(--success); font-weight: 600; }

    .score-big {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <div id="viewSim" class="view">

          <button class="btn-primary" style="width: auto; padding: 12px 20px;" onclick="enviarMensajeManual()">Enviar</button>

    </div>

  <script>
    function norm(str) {
      if (!str) return '';
      let text = str.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      const numMap = {
        "33 90": "3390", "33,90": "3390", "33.90": "3390", "34,90": "3490", "3490": "3490",
        "36 90": "3690", "36,90": "3690", "37,90": "3790", "41,90": "4190",
        "15 euros": "15", "quince": "15", "79 euros": "79", "80 euros": "80",
        "6 meses": "6meses", "seis meses": "6meses", "12 meses": "12meses"
      };

      Object.keys(numMap).forEach(k => {
        text = text.replace(new RegExp(k, 'g'), numMap[k]);
      });

      return text;
    }

    function matchesAny(textNorm, keywords) {
      return keywords.some(kw => {
        const normKw = norm(kw);
        if (textNorm.includes(normKw)) return true;
        const words = normKw.split(' ').filter(w => w.length > 3);
        if (words.length > 1) {
          return words.every(w => textNorm.includes(w));
        }
        return false;
      });
    }

    const itemNegativo = { 
      id: "no_cede_precio", 
      keywords: ["3390", "3690", "2990", "3490", "15", "79", "80"],

    };

    const perfilesConfig = {

        objeciones:[{ fase: 4, triggerItem: "plan_ahorro", texto: "Mmm... A ver... es que mi hija nos trae garrafas de 8 litros del súper a 1,60€ y para mí que nos sale bastante más barato que esto.", resolvedBy: ["046", "litro", "46 centimos", "acarrear", "enfriar", "puerta"] }

    },

        saludo: "Hola... buenas tardes. Pase, pase... siéntese por aquí un momento.",
        objeciones: [
          { fase: 2, triggerItem: "habito", texto: "Eh... a ver, a nosotros lo que nos preocupa es que yo tengo un problema feo en la rodilla y él en la mano... y cargar garrafas del súper es un suplicio.", resolvedBy: ["comodidad", "puerta", "suben", "llevamos", "cero esfuerzo"] },
          { fase: 3, triggerItem: "sostenibilidad", texto: "Y... mmm... una pregunta técnica... ¿las garrafas estas no soltarán microplásticos con el calor como las de la calle?", resolvedBy: ["policarbonato", "biberones", "50 usos", "calor", "no suelta"] }

    let estado = {
      comercial: "",
      perfilKey: "enrique",
      nivelDificultad: "junior",
      faseActual: 1,
      pasoConversacional: 0,
      ultimaRespuestaBot: "",
      itemsCompletados: new Set(),
      objecionesResueltas: 0,
      objecionesTotales: 0,
      penalizadoPrecio: false,
      objecionActiva: null,
      escuchando: false,
      botHablando: false,
      transcriptAcumulado: ""
    };

    let recognition = null;
    let silenceTimer = null;

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'es-ES';

      recognition.onresult = (event) => {
        if (estado.botHablando) return;

        clearTimeout(silenceTimer);
        let interim = '';
        let final = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }

        if (final) {
          estado.transcriptAcumulado += ' ' + final;
        }

        silenceTimer = setTimeout(() => {
          if ((estado.transcriptAcumulado.trim() || interim.trim()) && !estado.botHablando) {
            const textoEnviar = (estado.transcriptAcumulado + ' ' + interim).trim();
            estado.transcriptAcumulado = "";
            detenerMicrofono();
            procesarEntradaUsuario(textoEnviar);
          }
        }, 1100);
      };

      recognition.onerror = (err) => {
        console.warn("Speech Rec Error:", err);
        detenerMicrofono();
      };

      recognition.onend = () => {
        if (estado.escuchando && !estado.botHablando) {
          try { recognition.start(); } catch(e) {}
        }
      };
    }

    function toggleMic() {
      if (!recognition) {
        alert("Tu navegador no soporta Web Speech API. Usa Google Chrome o Edge.");
        return;
      }
      if (estado.escuchando) {
        detenerMicrofono();
      } else {
        iniciarMicrofono();
      }
    }

    function iniciarMicrofono() {
      if (estado.botHablando) return;
      estado.escuchando = true;
      estado.transcriptAcumulado = "";
      document.getElementById('btnMic').classList.add('recording');
      try { recognition.start(); } catch(e){}
    }

    function detenerMicrofono() {
      estado.escuchando = false;
      document.getElementById('btnMic').classList.remove('recording');
      try { recognition.stop(); } catch(e){}
    }

    function hablarBot(texto, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        detenerMicrofono();
        estado.botHablando = true;

        let textoLimpioParaVoz = texto
          .replace(/Mmm\.\.\./gi, '')
          .replace(/Eh\.\.\./gi, '')
          .replace(/Uf\.\.\./gi, '')
          .replace(/Ah\.\.\./gi, '')
          .replace(/\.\.\./g, ', ')
          .trim();

        const utter = new SpeechSynthesisUtterance(textoLimpioParaVoz);
        utter.lang = 'es-ES';
        utter.rate = 0.90;
        utter.pitch = 0.96;

        utter.onend = () => {
          estado.botHablando = false;
          setTimeout(() => {
            if (!estado.escuchando) iniciarMicrofono();
          }, 500);
          if (callback) callback();
        };
        window.speechSynthesis.speak(utter);
      } else if (callback) {
        estado.botHablando = false;
        callback();
      }
    }

    function iniciarSimulacion() {
      const nombre = document.getElementById('inputName').value.trim();
      if (!nombre) { alert("Por favor, introduce tu nombre."); return; }
      
      estado.comercial = nombre;
      estado.perfilKey = document.getElementById('selectPerfil').value;
      estado.nivelDificultad = document.getElementById('selectNivel').value;
      
      estado.faseActual = 1;
      estado.pasoConversacional = 0;
      estado.ultimaRespuestaBot = "";
      estado.itemsCompletados.clear();
      estado.objecionesResueltas = 0;
      estado.objecionesTotales = 0;
      estado.penalizadoPrecio = false;
      estado.objecionActiva = null;

      document.getElementById('userInfo').innerText = `${estado.comercial} | Perfil: ${estado.perfilKey} | Nivel: ${estado.nivelDificultad.toUpperCase()}`;
      
      const panel = document.getElementById('checklistPanel');
      const simLayout = document.getElementById('simLayout');
      if (estado.nivelDificultad === 'senior') {
        panel.style.display = 'none';
        simLayout.classList.add('senior-mode');
      } else {
        panel.style.display = 'block';
        simLayout.classList.remove('senior-mode');
      }

      document.getElementById('viewSetup').classList.remove('active');
      document.getElementById('viewSim').classList.add('active');

      renderChecklist();
      
      const saludoBot = perfilesConfig[estado.perfilKey].saludo;
      estado.ultimaRespuestaBot = saludoBot;
      addMessage('bot', saludoBot);
      hablarBot(saludoBot);
    }

    function enviarMensajeManual() {
      const input = document.getElementById('manualText');
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      procesarEntradaUsuario(text);
    }

    function procesarEntradaUsuario(texto) {
      if (estado.botHablando) return;

      addMessage('user', texto);
      const textNorm = norm(texto);

      if (estado.faseActual < 4 && matchesAny(textNorm, itemNegativo.keywords)) {
        estado.penalizadoPrecio = true;
        document.getElementById('penaltyNotice').style.display = 'block';
      }

      if (estado.objecionActiva) {
        if (matchesAny(textNorm, estado.objecionActiva.resolvedBy)) {
          estado.objecionesResueltas++;
          estado.objecionActiva = null;
          const res = "Ah, bueno... mmm... pues visto así de esa manera tiene usted toda la razón. Siga contándome.";
          addMessage('bot', res);
          hablarBot(res, () => {
            evaluarProgresoFase();
          });
          return;
        }
      }

      const faseConfig = checklistFases.find(f => f.fase === estado.faseActual);
      faseConfig.items.forEach(item => {
        if (!estado.itemsCompletados.has(item.id)) {
          if (matchesAny(textNorm, item.keywords)) {
            estado.itemsCompletados.add(item.id);
          }
        }
      });

      renderChecklist();

      let respuestaTexto = "";

      if (estado.faseActual === 1) {
        if (estado.pasoConversacional === 0) {
          respuestaTexto = "Ah... sí, sí, de Aquaservice... Por la prueba que nos dejaron la semana pasada. ¿Dígame?";
          estado.pasoConversacional = 1;
        } else if (estado.pasoConversacional === 1) {
          respuestaTexto = "Sí, claro... las decisiones en casa las tomamos nosotros directamente. Cuénteme.";
          estado.pasoConversacional = 2;
        } else {
          respuestaTexto = "Vale, coménteme... ¿qué condiciones especiales son esas que me decía?";
        }
      } 
      else if (estado.faseActual === 2) {
        if (matchesAny(textNorm, ["conocía", "conocia", "tele", "camion", "anuncios", "vecino"])) {
          respuestaTexto = "Sí, de oídas... una vecina del bloque lo tiene y vemos los camiones por la calle.";
        } else if (matchesAny(textNorm, ["supermercado", "super", "compraba", "acarrear", "coche", "cargar", "peso"])) {
          respuestaTexto = "Pues antes venía mi hija a traernos las garrafas del súper... porque nosotros no podemos cargar con peso.";
        } else if (matchesAny(textNorm, ["cuantos", "litro", "litros", "personas", "botellas"])) {
          respuestaTexto = "Pues la botella de prueba justo nos ha durado una semana entera.";
        } else {
          respuestaTexto = "Pues el agua la verdad que nos ha gustado mucho... sale muy fresquita y es comodísima.";
        }
      }
      else if (estado.faseActual === 3) {
        respuestaTexto = "Comprendo... ¿Y cómo funciona exactamente lo del reparto cada 28 días y la garantía del aparato?";
      }
      else if (estado.faseActual === 4) {
        respuestaTexto = "Entendido. A ver... dígame en cuánto se queda el precio final con el plan de ahorro.";
      }

      if (respuestaTexto === estado.ultimaRespuestaBot) {
        respuestaTexto = "Entendido... Siga explicándome, que le escucho.";
      }

      estado.ultimaRespuestaBot = respuestaTexto;

      const perfilObjeciones = perfilesConfig[estado.perfilKey].objeciones;
      const objTrigger = perfilObjeciones.find(o => o.fase === estado.faseActual && !o.disparada && estado.itemsCompletados.has(o.triggerItem));

      if (objTrigger && !estado.objecionActiva) {
        objTrigger.disparada = true;
        estado.objecionesTotales++;
        estado.objecionActiva = objTrigger;
        
        setTimeout(() => {
          addMessage('bot', objTrigger.texto);
          hablarBot(objTrigger.texto);
        }, 500);
        return;
      }

      setTimeout(() => {
        addMessage('bot', respuestaTexto);
        hablarBot(respuestaTexto, () => {
          evaluarProgresoFase();
        });
      }, 500);
    }

    function evaluarProgresoFase() {
      const faseConfig = checklistFases.find(f => f.fase === estado.faseActual);
      const marcadosEnFase = faseConfig.items.filter(i => estado.itemsCompletados.has(i.id)).length;
      const pctFase = (marcadosEnFase / faseConfig.items.length) * 100;

      if (pctFase >= 75 && !estado.objecionActiva) {
        if (estado.faseActual < 4) {
          estado.faseActual++;
          renderChecklist();
        } else {
          setTimeout(finalizarSimulacion, 1000);
        }
      }
    }

    function renderChecklist() {
      const faseConfig = checklistFases.find(f => f.fase === estado.faseActual);
      document.getElementById('currentPhaseTitle').innerText = `Fase ${estado.faseActual}: ${faseConfig.titulo}`;

      const marcadosEnFase = faseConfig.items.filter(i => estado.itemsCompletados.has(i.id)).length;
      const pctFase = Math.round((marcadosEnFase / faseConfig.items.length) * 100);
      document.getElementById('phaseProgress').innerText = `${pctFase}% Completado`;

      const container = document.getElementById('checklistItems');
      container.innerHTML = "";

      faseConfig.items.forEach(item => {
        const isDone = estado.itemsCompletados.has(item.id);
        const div = document.createElement('div');
        div.className = `chk-item ${isDone ? 'done' : ''}`;
        div.innerHTML = `
          <span class="chk-icon">${isDone ? '✅' : '⚪'}</span>
          <span>${item.desc}</span>
        `;
        container.appendChild(div);
      });
    }

    function addMessage(role, text) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function finalizarSimulacion() {
      detenerMicrofono();
      document.getElementById('viewSim').classList.remove('active');
      document.getElementById('viewResults').classList.add('active');

      let totalItemsAll = 0;
      checklistFases.forEach(f => totalItemsAll += f.items.length);
      const totalMarcados = estado.itemsCompletados.size;
      const avgPct = (totalMarcados / totalItemsAll) * 100;

      const objPct = estado.objecionesTotales > 0 ? (estado.objecionesResueltas / estado.objecionesTotales) * 100 : 100;

      let scoreFinal = Math.round((avgPct * 0.7) + (objPct * 0.3));
      if (estado.penalizadoPrecio) scoreFinal = Math.max(0, scoreFinal - 10);

      document.getElementById('scoreDisplay').innerText = scoreFinal;

      let feedback = "";
      if (scoreFinal >= 85) feedback = "¡Excelente desempeño! Dominas la argumentación oficial y la gestión de objeciones reales.";
      else if (scoreFinal >= 70) feedback = "Buen trabajo. Cubres los puntos clave pero puedes mejorar en la resolución fluida de objeciones.";
      else feedback = "Necesitas practicar más. Asegúrate de construir valor en la Fase de Servicio antes de hablar de precios.";

      document.getElementById('scoreFeedback').innerText = feedback;

      const breakdown = document.getElementById('scoreBreakdown');
      breakdown.innerHTML = `
        <li><strong>Ítems del checklist cubiertos:</strong> ${totalMarcados} de ${totalItemsAll} (${Math.round(avgPct)}%)</li>
        <li><strong>Objeciones resueltas:</strong> ${estado.objecionesResueltas} de ${estado.objecionesTotales} (${Math.round(objPct)}%)</li>
        <li><strong>Penalización por precio prematuro:</strong> ${estado.penalizadoPrecio ? '-10 puntos' : 'Ninguna (0 pts)'}</li>
      `;

      const historial = JSON.parse(localStorage.getItem('roleplay_history') || '[]');
      historial.push({
        fecha: new Date().toISOString(),
        comercial: estado.comercial,
        perfil: estado.perfilKey,
        nivel: estado.nivelDificultad,
        score: scoreFinal
      });
      localStorage.setItem('roleplay_history', JSON.stringify(historial));
    }

    function reiniciar() {
      document.getElementById('viewResults').classList.remove('active');
      document.getElementById('viewSetup').classList.remove('active');
      document.getElementById('viewSetup').classList.add('active');
      document.getElementById('chatBox').innerHTML = "";
    }
  </script>
</body>
