<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Roleplay Aquaservice 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0052cc;
      --primary-dark: #003d99;
      --primary-light: #e6f0ff;
      --accent: #00a8ff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --primary-light: #1e3a8a;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Public Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      max-width: 1280px;
      margin: 0 auto;
    }

    h1, h2, h3, .font-sora { font-family: 'Sora', sans-serif; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .logo {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 16px;
    }

    @media (min-width: 768px) {
      .sim-layout {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 16px;
        transition: all 0.3s ease;
      }
      .sim-layout.senior-mode {
        grid-template-columns: 1fr;
        max-width: 900px;
        margin: 0 auto;
      }
    }

    label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.9rem; }
    input, select, button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 1rem;
      background: var(--card-bg);
      color: var(--text);
    }

    button.btn-primary {
      background: var(--primary);
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover { background: var(--primary-dark); }

    .chat-box {
      height: 420px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--border);
    }
    .msg.user {
      align-self: flex-end;
      background: var(--primary);
      color: white;
    }

    .mic-controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }

    .mic-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .mic-btn.recording {
      background: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .checklist-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .chk-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .chk-item.done { color: var(--success); font-weight: 600; }

    .score-big {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>💧 Roleplay Aquaservice (Audio Real)</span>
    </div>
    <div id="userInfo" style="font-size: 0.875rem; color: var(--text-muted);"></div>
  </header>

  <div id="viewSetup" class="view active">
    <div class="card" style="max-width: 550px; margin: 40px auto;">
      <h2 style="margin-bottom: 16px;">Configuración de la Sesión</h2>
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div>
          <label for="inputName">Nombre del Comercial:</label>
          <input type="text" id="inputName" placeholder="Ej. Miguel Ángel" />
        </div>
        <div>
          <label for="selectNivel">Nivel de Entrenamiento:</label>
          <select id="selectNivel">
            <option value="junior">Junior (Ver checklist y pistas en tiempo real)</option>
            <option value="senior">Senior (Modo examen: sin pistas visuales)</option>
          </select>
        </div>
        <div>
          <label for="selectPerfil">Perfil de Cliente Activo:</label>
          <select id="selectPerfil">
            <option value="enrique">Enrique (Piloto Audio Real - Nietos y garrafas 8L)</option>
          </select>
        </div>
        <button id="btnStart" class="btn-primary" onclick="iniciarSimulacion()">Iniciar Roleplay</button>
      </div>
    </div>
  </div>

  <div id="viewSim" class="view">
    <div id="simLayout" class="sim-layout">
      <div>
        <div class="card" style="padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
          <span id="currentPhaseTitle" class="font-sora" style="font-weight: 700; color: var(--primary);">Fase 1: Presentación</span>
          <span id="phaseProgress" style="font-size: 0.85rem; font-weight: 600;">0% Completado</span>
        </div>
        <div id="chatBox" class="chat-box"></div>
        <div class="mic-controls">
          <button id="btnMic" class="mic-btn" onclick="toggleMic()">🎤</button>
          <input type="text" id="manualText" placeholder="O escribe aquí tu respuesta..." onkeydown="if(event.key==='Enter') enviarMensajeManual()" />
          <button class="btn-primary" style="width: auto; padding: 12px 20px;" onclick="enviarMensajeManual()">Enviar</button>
        </div>
      </div>

      <div id="checklistPanel" class="checklist-panel">
        <h3 class="font-sora" style="font-size: 1rem; margin-bottom: 12px;">Objetivos de la Fase</h3>
        <div id="checklistItems"></div>
        <div id="penaltyNotice" style="display:none; margin-top:16px; padding:8px; background:#fee2e2; color:#b91c1c; border-radius:6px; font-size:0.75rem; font-weight:600;">
          ⚠️ Penalización: Precio mencionado antes de la Fase de Servicio (-10 pts)
        </div>
      </div>
    </div>
  </div>

  <div id="viewResults" class="view">
    <div class="card" style="max-width: 600px; margin: 20px auto; text-align: center;">
      <h2 class="font-sora">Evaluación de la Sesión</h2>
      <div id="scoreDisplay" class="score-big">0</div>
      <p id="scoreFeedback" style="color: var(--text-muted); margin-bottom: 20px;"></p>
      
      <div style="text-align: left; margin-bottom: 20px;">
        <h3>Desglose de Puntuación:</h3>
        <ul id="scoreBreakdown" style="padding-left: 20px; margin-top: 8px; font-size: 0.95rem;"></ul>
      </div>

      <button class="btn-primary" onclick="reiniciar()">Nueva Sesión</button>
    </div>
  </div>

  <script>
    function norm(str) {
      if (!str) return '';
      let text = str.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      const numMap = {
        "33 90": "3390", "33,90": "3390", "33.90": "3390", "34,90": "3490", "3490": "3490",
        "36 90": "3690", "36,90": "3690", "37,90": "3790", "41,90": "4190",
        "15 euros": "15", "quince": "15", "79 euros": "79", "80 euros": "80",
        "6 meses": "6meses", "seis meses": "6meses", "12 meses": "12meses"
      };

      Object.keys(numMap).forEach(k => {
        text = text.replace(new RegExp(k, 'g'), numMap[k]);
      });

      return text;
    }

    function matchesAny(textNorm, keywords) {
      return keywords.some(kw => {
        const normKw = norm(kw);
        if (textNorm.includes(normKw)) return true;
        const words = normKw.split(' ').filter(w => w.length > 3);
        if (words.length > 1) {
          return words.every(w => textNorm.includes(w));
        }
        return false;
      });
    }

    const checklistFases = [
      {
        fase: 1,
        titulo: "Presentación",
        items: [
          { id: "saludo", desc: "Identificación, empresa y gancho inicial", keywords: [
              "hola", "buenas", "soy", "aquaservice", "prueba", "disfrutando", "encargado", "responsable"
          ]},
          { id: "autorizador", desc: "Confirma autorizador de prueba/decisor", keywords: [
              "autorizo", "decision", "mando", "decide", "usted", "titular", "responsable"
          ]}
        ]
      },
      {
        fase: 2,
        titulo: "Investigación (I+D)",
        items: [
          { id: "conocimiento", desc: "Indaga conocimiento previo de marca", keywords: ["conocía", "conocia", "tele", "camion", "anuncios", "vecino"] },
          { id: "habito", desc: "Hábito de compra previo (dolor de cargar)", keywords: ["supermercado", "super", "compraba", "acarrear", "coche", "cargar", "peso"] },
          { id: "miembros", desc: "Consenso pedagógico (1 Litro/persona/día)", keywords: ["cuantos", "litro", "litros", "personas", "botellas", "nietos"] },
          { id: "experiencia", desc: "Puntos fuertes de la prueba", keywords: ["prueba", "gustado", "fresquita", "comodidad", "sabor"] }
        ]
      },
      {
        fase: 3,
        titulo: "Servicio y Sostenibilidad",
        items: [
          { id: "logistica", desc: "Reparto programado (28 días) y entrega", keywords: ["28", "semanas", "programado", "suben", "puerta"] },
          { id: "urgencias", desc: "Avisos urgentes gratuitos (2/año)", keywords: ["urgentes", "urgencia", "48h", "gratuitas"] },
          { id: "maquina", desc: "Garantía de por vida, regulación y espacio", keywords: ["garantia", "termostato", "policarbonato"] },
          { id: "sostenibilidad", desc: "Medioambiente y Economía Circular", keywords: ["reciclar", "plastico", "vacias"] },
          { id: "app", desc: "Autogestión integral por la APP", keywords: ["aplicacion", "app", "movil"] }
        ]
      },
      {
        fase: 4,
        titulo: "Promoción y Cierre",
        items: [
          { id: "elimina_fianza", desc: "Elimina Fianza/Depósito (79€/80€)", keywords: ["fianza", "79", "deposito", "cero", "gratis"] },
          { id: "elimina_cuota", desc: "Elimina Cuota de servicio (15€/mes)", keywords: ["15", "quince", "cuota", "servicio", "quito"] },
          { id: "plan_ahorro", desc: "Plan Flexible (Grande + Botellines)", keywords: ["plan", "3690", "botellines", "litro", "046"] },
          { id: "compromiso", desc: "Permanencia flexible (6 o 12 meses)", keywords: ["permanencia", "6meses", "seis"] },
          { id: "pago_cobro", desc: "Método de Pago (IBAN, Bizum, SMS, Efectivo)", keywords: ["iban", "cuenta", "efectivo", "tarjeta"] },
          { id: "aquamigo_cortesia", desc: "Aquamigo y Agua de cortesía", keywords: ["aquamigo", "10", "descuento", "cortesia"] }
        ]
      }
    ];

    const itemNegativo = { id: "no_cede_precio", keywords: ["3390", "3690", "15", "79"], penalizacion: 10 };

    const perfilEnrique = {
      nombre: "Enrique",
      respuestas: {
        saludo: { texto: "Hola, buenas tardes. Pasa, pasa... perdona que estoy aquí con los nietos liados.", audio: "1_inicio" },
        decisor: { texto: "Sí, claro... las decisiones en casa las tomamos nosotros directamente. Cuénteme.", audio: "1_decisor" },
        cierre1: { texto: "Vale, coménteme... ¿qué condiciones especiales son esas que me decía?", audio: "1_cierre" },
        conocimiento: { texto: "Sí, de oídas... una vecina del bloque lo tiene y vemos los camiones por la calle.", audio: "2_conocimiento" },
        habito: { texto: "Pues antes venía mi hija a traernos las garrafas del súper... porque nosotros no podemos cargar con peso.", audio: "2_habito" },
        consumo: { texto: "Pues la botella de prueba justo nos ha durado una semana entera.", audio: "2_consumo" },
        experiencia: { texto: "Pues el agua la verdad que nos ha gustado mucho... sale muy fresquita y es comodísima.", audio: "2_experiencia" },
        servicio: { texto: "Comprendo... ¿Y cómo funciona exactamente lo del reparto cada 28 días y la garantía del aparato?", audio: "3_servicio" },
        pideprecio: { texto: "Entendido. A ver... dígame en cuánto se queda el precio final con el plan de ahorro.", audio: "4_pideprecio" },
        objecion: { texto: "A ver... es que mi hija nos trae garrafas de 8 litros del súper a 1,60€ y para mí que nos sale bastante más barato que esto.", audio: "4_objecion" },
        resuelta: { texto: "Ah, bueno... pues visto así de esa manera tiene usted toda la razón. Siga contándome.", audio: "4_resuelta" },
        comodin: { texto: "Entendido... Siga explicándome, que le escucho.", audio: "comodin" }
      }
    };

    let estado = {
      comercial: "",
      nivelDificultad: "junior",
      faseActual: 1,
      pasoConversacional: 0,
      itemsCompletados: new Set(),
      objecionesResueltas: 0,
      objecionesTotales: 0,
      penalizadoPrecio: false,
      objecionActiva: false,
      escuchando: false,
      botHablando: false,
      transcriptAcumulado: ""
    };

    let recognition = null;
    let silenceTimer = null;
    let currentAudioObj = null;

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'es-ES';

      recognition.onresult = (event) => {
        if (estado.botHablando) return;

        clearTimeout(silenceTimer);
        let interim = '';
        let final = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) final += event.results[i][0].transcript;
          else interim += event.results[i][0].transcript;
        }

        if (final) estado.transcriptAcumulado += ' ' + final;

        silenceTimer = setTimeout(() => {
          if ((estado.transcriptAcumulado.trim() || interim.trim()) && !estado.botHablando) {
            const textoEnviar = (estado.transcriptAcumulado + ' ' + interim).trim();
            estado.transcriptAcumulado = "";
            detenerMicrofono();
            procesarEntradaUsuario(textoEnviar);
          }
        }, 1100);
      };

      recognition.onerror = () => detenerMicrofono();
      recognition.onend = () => { if (estado.escuchando && !estado.botHablando) try { recognition.start(); } catch(e){} };
    }

    function toggleMic() {
      if (!recognition) { alert("Usa Google Chrome o Edge."); return; }
      if (estado.escuchando) detenerMicrofono();
      else iniciarMicrofono();
    }

    function iniciarMicrofono() {
      if (estado.botHablando) return;
      estado.escuchando = true;
      estado.transcriptAcumulado = "";
      document.getElementById('btnMic').classList.add('recording');
      try { recognition.start(); } catch(e){}
    }

    function detenerMicrofono() {
      estado.escuchando = false;
      document.getElementById('btnMic').classList.remove('recording');
      try { recognition.stop(); } catch(e){}
    }

    // MOTOR REPRODUCTOR DE AUDIOS REALES
    function reproducirAudioReal(nombreAudio, callback) {
      detenerMicrofono();
      estado.botHablando = true;

      if (currentAudioObj) {
        currentAudioObj.pause();
        currentAudioObj = null;
      }

      // Intenta reproducir .mp3 o .m4a
      currentAudioObj = new Audio(`audios/${nombreAudio}.mp3`);
      
      currentAudioObj.play().catch(() => {
        // Si falla .mp3, prueba con extensión .m4a
        currentAudioObj = new Audio(`audios/${nombreAudio}.m4a`);
        currentAudioObj.play().catch(e => console.log("Audio no encontrado:", nombreAudio));
      });

      currentAudioObj.onended = () => {
        estado.botHablando = false;
        setTimeout(() => { if (!estado.escuchando) iniciarMicrofono(); }, 500);
        if (callback) callback();
      };
    }

    function iniciarSimulacion() {
      const nombre = document.getElementById('inputName').value.trim();
      if (!nombre) { alert("Por favor, introduce tu nombre."); return; }
      
      estado.comercial = nombre;
      estado.nivelDificultad = document.getElementById('selectNivel').value;
      estado.faseActual = 1;
      estado.pasoConversacional = 0;
      estado.itemsCompletados.clear();
      estado.objecionesResueltas = 0;
      estado.objecionesTotales = 0;
      estado.penalizadoPrecio = false;
      estado.objecionActiva = false;

      document.getElementById('userInfo').innerText = `${estado.comercial} | Perfil: Enrique (Audio Real) | Nivel: ${estado.nivelDificultad.toUpperCase()}`;
      
      const panel = document.getElementById('checklistPanel');
      const simLayout = document.getElementById('simLayout');
      if (estado.nivelDificultad === 'senior') {
        panel.style.display = 'none';
        simLayout.classList.add('senior-mode');
      } else {
        panel.style.display = 'block';
        simLayout.classList.remove('senior-mode');
      }

      document.getElementById('viewSetup').classList.remove('active');
      document.getElementById('viewSim').classList.add('active');

      renderChecklist();
      
      const res = perfilEnrique.respuestas.saludo;
      addMessage('bot', res.texto);
      reproducirAudioReal(res.audio);
    }

    function enviarMensajeManual() {
      const input = document.getElementById('manualText');
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      procesarEntradaUsuario(text);
    }

    function procesarEntradaUsuario(texto) {
      if (estado.botHablando) return;

      addMessage('user', texto);
      const textNorm = norm(texto);

      if (estado.faseActual < 4 && matchesAny(textNorm, itemNegativo.keywords)) {
        estado.penalizadoPrecio = true;
        document.getElementById('penaltyNotice').style.display = 'block';
      }

      // Gestión Objeción
      if (estado.objecionActiva) {
        if (matchesAny(textNorm, ["046", "litro", "46 centimos", "acarrear", "enfriar", "puerta"])) {
          estado.objecionesResueltas++;
          estado.objecionActiva = false;
          const resRes = perfilEnrique.respuestas.resuelta;
          addMessage('bot', resRes.texto);
          reproducirAudioReal(resRes.audio, () => evaluarProgresoFase());
          return;
        }
      }

      const faseConfig = checklistFases.find(f => f.fase === estado.faseActual);
      faseConfig.items.forEach(item => {
        if (!estado.itemsCompletados.has(item.id)) {
          if (matchesAny(textNorm, item.keywords)) estado.itemsCompletados.add(item.id);
        }
      });

      renderChecklist();

      let respuestaObj = perfilEnrique.respuestas.comodin;

      if (estado.faseActual === 1) {
        if (estado.pasoConversacional === 0) {
          respuestaObj = perfilEnrique.respuestas.saludo;
          estado.pasoConversacional = 1;
        } else if (estado.pasoConversacional === 1) {
          respuestaObj = perfilEnrique.respuestas.decisor;
          estado.pasoConversacional = 2;
        } else {
          respuestaObj = perfilEnrique.respuestas.cierre1;
        }
      } 
      else if (estado.faseActual === 2) {
        if (matchesAny(textNorm, ["conocía", "conocia", "tele", "camion", "anuncios", "vecino"])) respuestaObj = perfilEnrique.respuestas.conocimiento;
        else if (matchesAny(textNorm, ["supermercado", "super", "compraba", "acarrear", "coche", "cargar", "peso"])) respuestaObj = perfilEnrique.respuestas.habito;
        else if (matchesAny(textNorm, ["cuantos", "litro", "litros", "personas", "botellas"])) respuestaObj = perfilEnrique.respuestas.consumo;
        else respuestaObj = perfilEnrique.respuestas.experiencia;
      }
      else if (estado.faseActual === 3) {
        respuestaObj = perfilEnrique.respuestas.servicio;
      }
      else if (estado.faseActual === 4) {
        if (estado.itemsCompletados.has("plan_ahorro") && !estado.objecionActiva) {
          estado.objecionActiva = true;
          estado.objecionesTotales++;
          respuestaObj = perfilEnrique.respuestas.objecion;
        } else {
          respuestaObj = perfilEnrique.respuestas.pideprecio;
        }
      }

      setTimeout(() => {
        addMessage('bot', respuestaObj.texto);
        reproducirAudioReal(respuestaObj.audio, () => evaluarProgresoFase());
      }, 300);
    }

    function evaluarProgresoFase() {
      const faseConfig = checklistFases.find(f => f.fase === estado.faseActual);
      const marcadosEnFase = faseConfig.items.filter(i => estado.itemsCompletados.has(i.id)).length;
      const pctFase = (marcadosEnFase / faseConfig.items.length) * 100;

      if (pctFase >= 75 && !estado.objecionActiva) {
        if (estado.faseActual < 4) {
          estado.faseActual++;
          renderChecklist();
        } else {
          setTimeout(finalizarSimulacion, 1000);
        }
      }
    }

    function renderChecklist() {
      const faseConfig = checklistFases.find(f => f.fase === estado.faseActual);
      document.getElementById('currentPhaseTitle').innerText = `Fase ${estado.faseActual}: ${faseConfig.titulo}`;

      const marcadosEnFase = faseConfig.items.filter(i => estado.itemsCompletados.has(i.id)).length;
      const pctFase = Math.round((marcadosEnFase / faseConfig.items.length) * 100);
      document.getElementById('phaseProgress').innerText = `${pctFase}% Completado`;

      const container = document.getElementById('checklistItems');
      container.innerHTML = "";

      faseConfig.items.forEach(item => {
        const isDone = estado.itemsCompletados.has(item.id);
        const div = document.createElement('div');
        div.className = `chk-item ${isDone ? 'done' : ''}`;
        div.innerHTML = `<span class="chk-icon">${isDone ? '✅' : '⚪'}</span><span>${item.desc}</span>`;
        container.appendChild(div);
      });
    }

    function addMessage(role, text) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function finalizarSimulacion() {
      detenerMicrofono();
      document.getElementById('viewSim').classList.remove('active');
      document.getElementById('viewResults').classList.add('active');

      let totalItemsAll = 0;
      checklistFases.forEach(f => totalItemsAll += f.items.length);
      const totalMarcados = estado.itemsCompletados.size;
      const avgPct = (totalMarcados / totalItemsAll) * 100;

      const objPct = estado.objecionesTotales > 0 ? (estado.objecionesResueltas / estado.objecionesTotales) * 100 : 100;

      let scoreFinal = Math.round((avgPct * 0.7) + (objPct * 0.3));
      if (estado.penalizadoPrecio) scoreFinal = Math.max(0, scoreFinal - 10);

      document.getElementById('scoreDisplay').innerText = scoreFinal;

      let feedback = "";
      if (scoreFinal >= 85) feedback = "¡Excelente desempeño! Dominas la argumentación oficial y la gestión de objeciones reales.";
      else if (scoreFinal >= 70) feedback = "Buen trabajo. Cubres los puntos clave pero puedes mejorar en la resolución fluida de objeciones.";
      else feedback = "Necesitas practicar más. Asegúrate de construir valor en la Fase de Servicio antes de hablar de precios.";

      document.getElementById('scoreFeedback').innerText = feedback;

      const breakdown = document.getElementById('scoreBreakdown');
      breakdown.innerHTML = `
        <li><strong>Ítems del checklist cubiertos:</strong> ${totalMarcados} de ${totalItemsAll} (${Math.round(avgPct)}%)</li>
        <li><strong>Objeciones resueltas:</strong> ${estado.objecionesResueltas} de ${estado.objecionesTotales} (${Math.round(objPct)}%)</li>
        <li><strong>Penalización por precio prematuro:</strong> ${estado.penalizadoPrecio ? '-10 puntos' : 'Ninguna (0 pts)'}</li>
      `;
    }

    function reiniciar() {
      document.getElementById('viewResults').classList.remove('active');
      document.getElementById('viewSetup').classList.add('active');
      document.getElementById('chatBox').innerHTML = "";
    }
  </script>
</body>
</html>
